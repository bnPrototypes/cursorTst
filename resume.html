<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Workflow</title>
    <link rel="stylesheet" href="resume.css">
</head>
<body>
    <div class="container">
        <h1>Resume Workflow</h1>
        <div id="url-display"></div>
        <button id="resume-btn" onclick="resumeWorkflow()">Senden</button>
        <div id="sending"></div>
        <div id="result"></div>
    </div>

    <script>
        // Get resume URL and data from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const resumeUrl = urlParams.get('url');
        const selectedData = urlParams.get('data');

        // Display the resume URL and selected data
        document.getElementById('url-display').textContent = 'Resume URL: ' + (resumeUrl || '(missing)');
        if (selectedData) {
            const dataDisplay = document.createElement('div');
            dataDisplay.id = 'data-display';
            dataDisplay.textContent = 'Selected Data: ' + selectedData;
            document.getElementById('url-display').after(dataDisplay);
        }

        function showSendingDetails(method, url, data) {
            const sendingDiv = document.getElementById('sending');
            const bodyText = data ? JSON.stringify(data) : '(none)';
            sendingDiv.innerHTML = '<div class="info">Sending ' + method + ' to: ' + url + '<br>Headers: (none)<br>Body: ' + bodyText + '</div>';
        }

        async function resumeWorkflow() {
            const button = document.getElementById('resume-btn');
            const resultDiv = document.getElementById('result');
            const sendingDiv = document.getElementById('sending');
            const method = 'POST'; // Always use POST

            resultDiv.innerHTML = '';
            sendingDiv.innerHTML = '';

            if (!resumeUrl) {
                resultDiv.innerHTML = '<div class="error">No resume URL provided</div>';
                return;
            }

            try {
                button.textContent = 'Sending...';
                button.disabled = true;

                // Parse selected data if available
                let dataToSend = null;
                if (selectedData) {
                    try {
                        dataToSend = JSON.parse(selectedData);
                    } catch (e) {
                        console.error('Error parsing selected data:', e);
                    }
                }

                // IMPORTANT: Do not set any headers or body → avoid CORS preflight
                showSendingDetails(method, resumeUrl, dataToSend);
                console.log('Sending', method, 'to:', resumeUrl, 'with data:', dataToSend);

                const requestOptions = { 
                    method: 'POST',
                    body: dataToSend ? JSON.stringify(dataToSend) : '{}'
                };

                const response = await fetch(resumeUrl, requestOptions);

                console.log('Response status:', response.status);
                console.log('Response statusText:', response.statusText);

                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">Data sent successfully.</div>';
                } else {
                    resultDiv.innerHTML = '<div class="error">Failed: ' + response.status + ' ' + response.statusText + '</div>';
                }

            } catch (error) {
                console.error('Error:', error);
                resultDiv.innerHTML = '<div class="error">Error: ' + error.message + '</div>';
            } finally {
                button.textContent = 'Senden';
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
