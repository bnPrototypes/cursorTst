<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N8N Webhook Test - Index 2</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: #808080;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-4">
                    <div class="card-body text-center">
                        <h2 class="card-title mb-4 text-primary">N8N Webhook Test - Index 2</h2>
                        <button class="btn btn-primary btn-lg mb-3" onclick="call()">
                            <i class="bi bi-play-circle me-2"></i>Trigger Workflow
                        </button>
                        <div id="msg" class="alert alert-info" style="display: none;"></div>
                        <div class="mb-3">
                            <label for="dropdown" class="form-label">Response Data:</label>
                            <select id="dropdown" class="form-select" size="8"></select>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-outline-secondary" onclick="window.location.href='index.html'">
                                <i class="bi bi-arrow-left me-2"></i>Back to Index 1
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <script>
        async function call() {
            const msg = document.getElementById('msg');
            const dropdown = document.getElementById('dropdown');
            dropdown.innerHTML = ""; // leeren

            try {
                // Show loading state
                msg.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Loading...';
                msg.className = 'alert alert-info';
                msg.style.display = 'block';
                
                let r = await fetch('https://n8n.bn-prototypes.de/webhook-test/89ce9ffd-4f16-4f59-9476-f42b8164685f', {method:'POST'});
                let data = await r.json();

                msg.innerHTML = '<i class="bi bi-check-circle me-2"></i>Antwort von n8n erhalten';
                msg.className = 'alert alert-success';

                // JSON-Werte in Dropdown packen
                Object.entries(data).forEach(([key, value]) => {
                    let opt = document.createElement("option");
                    opt.value = value;
                    opt.text = key + ": " + value;
                    dropdown.appendChild(opt);
                });
            } catch(e) {
                msg.innerHTML = '<i class="bi bi-exclamation-triangle me-2"></i>Fehler: ' + e.message;
                msg.className = 'alert alert-danger';
            }
        }
    </script>
</body>
</html>
