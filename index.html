<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N8N Webhook Test</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            min-height: 100vh;
            background: #808080;
        }
        
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card p-4">
                    <div class="card-body text-center">
                        <h2 class="card-title mb-4 text-primary" id="title">N8N Webhook Test</h2>
                        <button class="btn btn-primary btn-lg" onclick="call()" id="webhookButton">
                            <i class="bi bi-play-circle me-2"></i>Trigger Workflow
                        </button>
                        <div id="msg" class="mt-3"></div>
                        <div id="table-container" class="mt-3" style="display: none;">
                            <h5 class="text-primary">Response Data:</h5>
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Key</th>
                                            <th>Value</th>
                                        </tr>
                                    </thead>
                                    <tbody id="table-body">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div id="dropdown-container" class="mt-3" style="display: none;">
                            <h5 class="text-primary">Response Data (Dropdown):</h5>
                            <div class="mb-3">
                                <label for="response-dropdown" class="form-label">Select Response Data:</label>
                                <select id="response-dropdown" class="form-select" size="8"></select>
                            </div>
                        </div>
                        <div id="resume-container" class="mt-3" style="display: none;">
                            <a href="#" id="resume-link" class="btn btn-success btn-lg">
                                <i class="bi bi-play-fill me-2"></i>Senden
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    
    <script>
        async function call() {
            const button = event.target;
            const originalText = button.innerHTML;
            
            try {
                // Show loading state
                button.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Triggering...';
                button.disabled = true;
                
                // Hide table and clear previous data
                document.getElementById('table-container').style.display = 'none';
                document.getElementById('table-body').innerHTML = '';
                document.getElementById('dropdown-container').style.display = 'none';
                document.getElementById('response-dropdown').innerHTML = '';
                document.getElementById('resume-container').style.display = 'none';
                
                // Hide the button and title
                button.style.display = 'none';
                document.getElementById('title').style.display = 'none';
                
                let r = await fetch('https://n8n.bn-prototypes.de/webhook-test/89ce9ffd-4f16-4f59-9476-f42b8164685f', {method:'POST'});
                
                if (r.ok) {
                    // Parse and display response data in table and dropdown
                    try {
                        const data = await r.json();
                        const tableBody = document.getElementById('table-body');
                        const dropdown = document.getElementById('response-dropdown');
                        
                        Object.entries(data).forEach(([key, value]) => {
                            // Add to table
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td><strong>${key}</strong></td>
                                <td>${typeof value === 'object' ? JSON.stringify(value) : value}</td>
                            `;
                            tableBody.appendChild(row);
                            
                            // Add to dropdown
                            const option = document.createElement('option');
                            option.value = value;
                            option.text = key + ': ' + (typeof value === 'object' ? JSON.stringify(value) : value);
                            dropdown.appendChild(option);
                        });
                        
                        // Show both table and dropdown
                        document.getElementById('table-container').style.display = 'block';
                        document.getElementById('dropdown-container').style.display = 'block';
                        
                        // Add event listener to dropdown to update resume link when selection changes
                        const dropdown = document.getElementById('response-dropdown');
                        dropdown.addEventListener('change', updateResumeLink);
                        
                        // Check if resumeUrl exists and show resume button
                        console.log('Response data:', data);
                        
                        // Check for resumeURL in the response
                        if (data.resumeURL) {
                            console.log('Found resumeURL:', data.resumeURL);
                            // Store the resume URL for later use
                            window.storedResumeUrl = data.resumeURL;
                            document.getElementById('resume-container').style.display = 'block';
                            // Set up dynamic resume link that updates when dropdown selection changes
                            updateResumeLink();
                        } else if (data.$execution && data.$execution.resumeUrl) {
                            console.log('Found resumeUrl:', data.$execution.resumeUrl);
                            document.getElementById('resume-container').style.display = 'block';
                        } else {
                            console.log('No resumeUrl found in data');
                            // Also check for any key containing 'resumeUrl'
                            const hasResumeUrl = Object.keys(data).some(key => 
                                key.toLowerCase().includes('resumeurl') || 
                                (typeof data[key] === 'object' && data[key] && 
                                 Object.keys(data[key]).some(subKey => subKey.toLowerCase().includes('resumeurl')))
                            );
                            if (hasResumeUrl) {
                                console.log('Found resumeUrl in nested data');
                                document.getElementById('resume-container').style.display = 'block';
                            }
                        }
                    } catch (jsonError) {
                        console.log('No JSON response data to display');
                    }
                } else {
                    const msgDiv = document.getElementById('msg');
                    msgDiv.innerHTML = '<div class="alert alert-danger" role="alert"><i class="bi bi-exclamation-triangle me-2"></i>Error: ' + r.status + ' ' + r.statusText + '</div>';
                }
            } catch(e) {
                const msgDiv = document.getElementById('msg');
                msgDiv.innerHTML = '<div class="alert alert-danger" role="alert"><i class="bi bi-exclamation-triangle me-2"></i>Failed: ' + e.message + '</div>';
            } finally {
                // Don't restore button state - keep it hidden
                // button.innerHTML = originalText;
                // button.disabled = false;
            }
        }
        
        function getSelectedDropdownData() {
            const dropdown = document.getElementById('response-dropdown');
            const selectedOption = dropdown.options[dropdown.selectedIndex];
            if (selectedOption) {
                return {
                    key: selectedOption.text.split(':')[0],
                    value: selectedOption.value
                };
            }
            // If no option is selected, return the first option
            if (dropdown.options.length > 0) {
                const firstOption = dropdown.options[0];
                return {
                    key: firstOption.text.split(':')[0],
                    value: firstOption.value
                };
            }
            return null;
        }
        
        function updateResumeLink() {
            if (window.storedResumeUrl) {
                const resumeLink = document.getElementById('resume-link');
                const selectedData = getSelectedDropdownData();
                console.log('Updating resume link with selected data:', selectedData);
                resumeLink.href = 'resume.html?url=' + encodeURIComponent(window.storedResumeUrl) + 
                                 '&data=' + encodeURIComponent(JSON.stringify(selectedData));
            }
        }
    </script>
</body>
</html>
