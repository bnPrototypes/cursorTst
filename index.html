<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Button</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #0056b3;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .button-container {
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div class="button-container">
        <button onclick="sayHello()">Hello</button>
        <button onclick="sayGoodBye()">Good bye</button>
    </div>
    
    <script>
        function sayHello() {
            alert('Hello, World!');
        }
        
        function sayGoodBye() {
            alert('Good bye!');
        }
    </script>
</body>
</html>
