<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N8N Webhook Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>N8N Webhook Test</h1>
        <button onclick="callWebhook()" id="webhookButton">Call N8N Webhook</button>
        <div id="result"></div>
    </div>

    <script>
        async function callWebhook() {
            const button = document.getElementById('webhookButton');
            const resultDiv = document.getElementById('result');
            
            // Show loading state
            button.innerHTML = 'Calling...';
            button.disabled = true;
            resultDiv.style.display = 'none';
            
            try {
                // Call the webhook through our server (to avoid CORS issues)
                const response = await fetch('/api/trigger-webhook', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: 'Hello from web interface!',
                        timestamp: new Date().toISOString()
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showResult('Webhook called successfully! Response: ' + JSON.stringify(result.data), 'success');
                } else {
                    showResult('Error: ' + result.message, 'error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showResult('Failed to call webhook: ' + error.message, 'error');
            } finally {
                // Restore button state
                button.innerHTML = 'Call N8N Webhook';
                button.disabled = false;
            }
        }
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = type;
            resultDiv.style.display = 'block';
        }
    </script>
</body>
</html>
